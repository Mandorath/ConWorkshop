apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod
namePrefix: prod-

resources:
  - ../../base

# Replicas directive handles replica scaling cleanly without external patch files
replicas:
  - name: web-app
    count: 5

patches:
  - path: patch-resources.yaml

# Automatically generates ConfigMap with hash suffix (e.g., prod-app-config-g8h7f2)
configMapGenerator:
  - name: app-config
    envs:
      - config.env

labels:
  - pairs:
      environment: production