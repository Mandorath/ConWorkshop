apiVersion: v1
kind: Config
preferences: {}

# 1. WHERE TO CONNECT
clusters:
- cluster:
    # Cluster CA certificate (base64-encoded) used to validate the API server TLS cert
    certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0t...
    # The Kubernetes API Server endpoint (typically port 6443)
    server: https://192.168.122.10:6443
  name: demo-cluster

# 2. WHO IS CONNECTING
users:
- name: admin@demo-cluster
  user:
    # Client public certificate identifying the user (e.g., CN=admin, O=system:masters)
    client-certificate-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0t...
    # Client private key proving ownership of the certificate
    client-key-data: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS...

# 3. HOW THE TWO ARE BOUND TOGETHER
contexts:
- context:
    cluster: demo-cluster
    user: admin@demo-cluster
    namespace: default    # Optional: sets the default namespace for kubectl commands
  name: admin@demo-cluster

# 4. ACTIVE TARGET
current-context: admin@demo-cluster