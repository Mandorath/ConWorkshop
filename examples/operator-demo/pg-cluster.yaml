# pg-cluster.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: db-demo
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: demo-db
  namespace: db-demo
spec:
  instances: 2
  
  # Resource requests and limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

  # Storage configuration for WAL and Database files
  # storage:
  #   size: 1Gi
  storage:
    ephemeral: true